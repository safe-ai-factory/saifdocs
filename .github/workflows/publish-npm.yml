# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN required.
#
# Bootstrap (one-time, manual): publish v0.1.0 from a local CLI
# (`npm publish dist-pack/safe-ai-factory-saifdocs-0.1.0.tgz --access public`),
# then go to npmjs.com → @safe-ai-factory/saifdocs → Settings → Trusted
# Publishers and add this repo + this workflow file. After that, CI handles
# every subsequent tag push automatically via OIDC.

name: Publish npm

on:
  push:
    tags:
      # Trigger on tags like v0.1.0
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) + --provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VER"
            exit 1
          fi

      - name: Check
        run: pnpm run check

      - name: Build and pack
        run: bash scripts/package.sh

      - name: Publish verified tarball to npm (OIDC + provenance)
        run: npm publish dist-pack/safe-ai-factory-saifdocs-*.tgz --access public --provenance
