- id: generate-first-docs
  persona: docs-author
  task: generate-first-docs
  goal: Run saifdocs gen end-to-end from a minimal docspec tree to generated markdown files

- id: keep-docs-fresh
  persona: docs-author
  task: keep-docs-fresh
  goal: Use saifdocs validate and update to detect and regenerate stale pages after source changes

- id: verify-doc-coverage
  persona: docs-author
  task: verify-doc-coverage
  goal: Use saifdocs audit to confirm every declared page has been generated and find any gaps

- id: review-doc-quality
  persona: docs-author
  task: review-doc-quality
  goal: Run saifdocs review to get a persona-simulation quality report on generated docs
